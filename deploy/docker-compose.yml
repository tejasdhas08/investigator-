# CrimeScene AI — dev / single-node on-prem stack (ARCHITECTURE.md Section 2).
# GPU stage-2 worker is added via docker-compose.gpu.yml. Without it, run with
# PIPELINE_FAKE=1 (fixture detector) for full end-to-end demos on CPU.
name: crimescene

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crimescene
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crimescene}
      POSTGRES_DB: crimescene
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimescene"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../backend
      target: base
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://crimescene:${POSTGRES_PASSWORD:-crimescene}@postgres:5432/crimescene
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    command: >
      sh -c "alembic upgrade head && python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker-cpu:
    build:
      context: ../backend
      target: worker-cpu
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://crimescene:${POSTGRES_PASSWORD:-crimescene}@postgres:5432/crimescene
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Consumes the 'gpu' queue. In fake mode (PIPELINE_FAKE=1) the fixture detector is
  # CPU-only, so this plain worker suffices; the real CV worker overrides it in
  # docker-compose.gpu.yml.
  worker-stage2:
    build:
      context: ../backend
      target: worker-cpu
    command: celery -A app.pipeline.celery_app.celery worker -Q gpu -l info --concurrency 1
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://crimescene:${POSTGRES_PASSWORD:-crimescene}@postgres:5432/crimescene
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  beat:
    build:
      context: ../backend
      target: beat
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://crimescene:${POSTGRES_PASSWORD:-crimescene}@postgres:5432/crimescene
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
